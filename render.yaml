services:
  - type: web
    name: rentaleze-app
    runtime: node
    plan: starter            # a persistent disk needs a paid plan
    region: virginia
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: rentaleze-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /data/rentaleze.db
      - key: UPLOADS_DIR
        value: /data/uploads
      # Main domain shows only the coming-soon / waitlist page
      - key: WAITLIST_HOSTS
        value: rentaleze.com,www.rentaleze.com
      # Password for beta.rentaleze.com — set it yourself in the Render dashboard
      - key: BETA_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://beta.rentaleze.com
      - key: SHOW_DEMO_LISTINGS
        value: "false"
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # Used to download the waitlist as CSV (header x-admin-token)
      - key: ADMIN_TOKEN
        generateValue: true
      # ShipStation shipping labels (see docs/SHIPPING.md) — set the key and carrier IDs in the dashboard
      - key: SHIPSTATION_API_KEY
        sync: false
      - key: SHIPSTATION_CARRIER_IDS
        sync: false
      - key: SHIPSTATION_SERVICE_CODES
        value: usps_ground_advantage,usps_priority_mail,ups_ground,ups_ground_saver,fedex_ground,fedex_home_delivery
      # Add ?token=<this value> to the webhook URL you register in ShipStation
      - key: SHIPSTATION_WEBHOOK_TOKEN
        generateValue: true
      # ── Trust & safety (see docs/TRUST_AND_ADMIN.md) ──
      # Comma-separated emails that get the admin panel at /admin
      - key: ADMIN_EMAILS
        sync: false
      # Stripe secret key (also used for Identity ID checks)
      - key: STRIPE_SECRET_KEY
        sync: false
      # Signing secret of the webhook pointing at /api/webhooks/identity
      - key: STRIPE_IDENTITY_WEBHOOK_SECRET
        sync: false
      # Twilio Verify, for text-message codes
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      # Signs the private links to rental condition photos
      - key: FILE_URL_SECRET
        generateValue: true
      # ── Notifications (see docs/NOTIFICATIONS_AND_HELPDESK.md) ──
      # Resend API key; verify rentaleze.com in Resend first
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Rentaleze <notifications@rentaleze.com>
      - key: APP_URL
        value: https://beta.rentaleze.com
      # Twilio Messaging Service for notification texts (same account as TWILIO_ACCOUNT_SID)
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      # Optional: comma-separated support agent emails (agents can also be added in the help desk)
      - key: SUPPORT_EMAILS
        sync: false
